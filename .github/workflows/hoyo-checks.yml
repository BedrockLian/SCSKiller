name: HoYo checks

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      package:
        description: Build the complete self-contained Windows x64 prerelease zip
        type: boolean
        default: false
      version:
        description: Fork prerelease version (X.Y.Z-hoyo.N)
        type: string
        default: 1.4.6-hoyo.1

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-2025
    timeout-minutes: 90
    env:
      DOTNET_NOLOGO: 'true'
      DOTNET_CLI_TELEMETRY_OPTOUT: 'true'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: 10.0.403
      - name: Build solution
        shell: pwsh
        run: dotnet build SCSKiller.slnx -c Release --nologo
      - name: Reader regression tests
        shell: pwsh
        run: dotnet test tests/SCSKiller.Tests/SCSKiller.Tests.csproj -c Release --no-build --filter 'Needs!=Game' --logger trx --results-directory out/test-results
      - name: Build fork package
        if: github.event_name == 'workflow_dispatch' && inputs.package
        shell: pwsh
        env:
          HOYO_VERSION: ${{ inputs.version }}
        run: ./build/publish-hoyo.ps1 -Version $env:HOYO_VERSION
      - name: Test results
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: hoyo-test-results
          path: out/test-results/
          if-no-files-found: warn
      - name: Unsigned candidate package
        if: github.event_name == 'workflow_dispatch' && inputs.package
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: SCSKiller-HoYo-win-x64
          path: |
            dist/SCSKiller-HoYo-*.zip
            dist/SCSKiller-HoYo-*.zip.sha256
          if-no-files-found: error
