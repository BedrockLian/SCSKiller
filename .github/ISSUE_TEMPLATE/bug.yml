name: Bug report
description: Something doesn't work, or a game isn't detected or compiled as it should be.
labels: [bug]
body:
  - type: input
    id: version
    attributes:
      label: SCSKiller version
      description: The app's About page or SCSKiller-CLI.cmd --version shows it. Include the HoYo suffix.
    validations:
      required: true
  - type: input
    id: windows
    attributes:
      label: Windows version
      placeholder: Windows 11 24H2 (26100)
    validations:
      required: true
  - type: input
    id: gpu
    attributes:
      label: GPU
      placeholder: NVIDIA GeForce RTX 4070 / AMD Radeon RX 7800 XT
    validations:
      required: true
  - type: input
    id: driver
    attributes:
      label: GPU driver version
      placeholder: "NVIDIA 610.88 / AMD Adrenalin 26.10.1"
    validations:
      required: true
  - type: input
    id: game
    attributes:
      label: Game
      description: Name, game version and store (including HoYoPlay). Leave empty if the bug isn't about a game.
      placeholder: Some Game (Steam)
  - type: textarea
    id: what
    attributes:
      label: What happened, and what you expected
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Open SCSKiller
        2. Press Compile on ...
        3. ...
  - type: textarea
    id: logs
    attributes:
      label: Output or error text
      description: Include build-info.json's commit and relevant errors or the end of app.log / crash.log in the fork package's data folder (source launcher uses out/app-data). Remove personal paths and credentials. Do not attach game files, shader dumps or whole databases.
      render: text
